<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanShelf</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-backdrop">
    <div class="popup-card">
      <header class="popup-header">
        <h1 class="popup-title">CleanShelf</h1>
        <p class="popup-preview">Save, folder, and copy your code snippets locally.</p>
      </header>

      <section class="popup-section">
        <label class="popup-label" for="snippetTitle">New snippet</label>
        <div class="popup-field-row">
          <input type="text" id="snippetTitle" class="popup-input" placeholder="Title" />
          <input type="text" id="snippetFolder" class="popup-input popup-input-folder" placeholder="Folder" list="folderList" />
          <datalist id="folderList"></datalist>
        </div>
        <textarea id="snippetContent" class="popup-textarea" placeholder="Paste your snippet here…"></textarea>
        <button id="btnSave" class="popup-btn" type="button">Save</button>
      </section>

      <section class="popup-section popup-section-list">
        <label class="popup-label">Your snippets</label>
        <div id="snippetList" class="popup-list"></div>
      </section>

      <p class="popup-hint">Data stays in your browser. No tracking. No network calls.</p>

      <button class="popup-debug-toggle" id="btnDebug" type="button">Debug ▾</button>
      <div class="popup-debug-panel" id="debugPanel" hidden>
        <div class="debug-row">
          <span class="debug-key">Last Error:</span>
          <span class="debug-val" id="dbgLastError">none</span>
        </div>
        <div class="debug-row">
          <span class="debug-key">Checkup:</span>
          <button id="dbgRunChecks" class="debug-btn" type="button">Run steps</button>
        </div>
        <ul class="debug-steps" id="dbgSteps"></ul>
      </div>
    </div>

    <div class="popup-toast" id="toast" hidden role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
